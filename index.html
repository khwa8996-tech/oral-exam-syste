<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الامتحان الشفهي الذكية والمطورة</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 800px;
            margin: 20px auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 800;
        }

        .rooms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .room-card {
            background: linear-gradient(135deg, var(--primary), #6366f1);
            color: white;
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: 0.2s;
        }

        .room-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.4);
        }

        .section-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            padding: 25px;
            border-radius: 16px;
            margin-bottom: 20px;
        }

        label {
            font-weight: 700;
            color: var(--text-main);
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-size: 14px;
        }

        textarea, input[type="file"], button {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            border-radius: 10px;
            border: 1px solid #cbd5e1;
            box-sizing: border-box;
            background: white;
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .student-box {
            background: #eef2ff;
            border: 2px dashed var(--primary);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 15px;
            color: var(--primary);
        }

        .question-box {
            background: #fffbeb;
            border: 1px solid #fde68a;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 700;
            color: #b45309;
            line-height: 1.5;
        }

        .options-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            color: var(--text-main);
            text-align: center;
        }

        .option-btn:hover {
            border-color: var(--primary);
            background: #f1f5f9;
        }

        .timer {
            text-align: center;
            font-size: 17px;
            color: var(--danger);
            margin-bottom: 15px;
            font-weight: 700;
        }

        .btn-start { background-color: var(--primary); color: white; border: none; cursor: pointer; font-weight: 700; }
        .btn-start:hover { background-color: var(--primary-hover); }

        .btn-back { background-color: #64748b; color: white; border: none; cursor: pointer; font-weight: 700; margin-top: 15px; }
        .btn-back:hover { background-color: #475569; }

        #alert-banner {
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 15px;
            display: none;
        }
        .alert-success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-danger { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
        }
        th, td {
            border-bottom: 1px solid #f1f5f9;
            padding: 10px;
            text-align: center;
            font-size: 14px;
        }
        th { background-color: #f8fafc; color: var(--text-muted); font-weight: 700; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>منصة الامتحان الشفهي الذكية والمطورة</h2>
    
    <div id="rooms-section">
        <h3 style="text-align: center; color: var(--text-muted); margin-bottom: 20px; font-size: 18px;">اختر غرفة الشعبة لبدء الجلسة الامتحانية:</h3>
        <div class="rooms-grid">
            <div class="room-card" onclick="openRoom('الرابع (أ)')">غرفة الرابع أ 🏫</div>
            <div class="room-card" onclick="openRoom('الرابع (ب)')">غرفة الرابع ب 🏫</div>
            <div class="room-card" onclick="openRoom('الخامس (أ)')">غرفة الخامس أ 🏫</div>
            <div class="room-card" onclick="openRoom('الخامس (ب)')">غرفة الخامس ب 🏫</div>
        </div>
    </div>

    <div class="section-box hidden" id="setup-section">
        <h3 id="room-title-setup" style="color: var(--primary); text-align: center; margin-bottom: 15px;"></h3>
        
        <label>📁 رفع ملفات أسماء الطلاب (PDF أو TXT)</label>
        <input type="file" id="students-files" accept=".pdf, .txt" multiple onchange="handleFiles(event, 'students-input')">
        <textarea id="students-input" placeholder="سيتم استخراج الأسماء تلقائياً أو يمكنك كتابتها يدوياً..."></textarea>

        <label>📚 رفع ملفات المحاضرات والأسئلة (PDF أو TXT)</label>
        <input type="file" id="lecture-files" accept=".pdf, .txt" multiple onchange="handleFiles(event, 'lecture-input')">
        <textarea id="lecture-input" placeholder="سيتم استخراج الأسئلة وصياغتها تلقائياً..."></textarea>

        <button class="btn-start" style="margin-top: 15px;" onclick="startExam()">بدء الجلسة الامتحانية 🚀</button>
        <button class="btn-back" onclick="backToRooms()">العودة لاختيار الغرف 🔙</button>
    </div>

    <div id="exam-section" class="hidden">
        <div id="room-title-exam" style="text-align: center; font-weight: 800; color: var(--primary); font-size: 20px; margin-bottom: 15px;"></div>
        
        <div id="alert-banner"></div>

        <div class="student-box" id="current-student">الطالب: --</div>
        <div class="question-box" id="current-question">السؤال: --</div>
        <div class="timer" id="timer-display">الوقت المتبقي: 45 ثانية</div>

        <!-- خيارات الإجابة المتعددة -->
        <div class="options-container" id="options-container">
            <!-- يتم توليد الخيارات أ، ب، ج، د برمجياً هنا -->
        </div>

        <button class="btn-back" style="background-color: var(--text-muted); margin-top: 5px;" onclick="nextStep()">تخطي هذا السؤال ⏭️</button>

        <h3 style="font-size: 15px; color: var(--text-main); margin-top: 20px;">سجل الدرجات والتقييمات:</h3>
        <table>
            <thead>
                <tr>
                    <th>اسم الطالب</th>
                    <th>السؤال</th>
                    <th>التقييم</th>
                </tr>
            </thead>
            <tbody id="results-table-body"></tbody>
        </table>

        <button class="btn-back" onclick="resetAndBackToRooms()">🔄 تصفير النتائج والعودة للغرف</button>
    </div>
</div>

<script>
    let selectedClassName = "";
    let studentsList = [];
    let questionsList = [];
    let studentIndex = -1;
    let questionIndex = 0;
    let currentQObj = null;
    let timer;
    let timeLeft = 45;

    // دالة إصدار الأصوات (رنة نجاح ورنة خطأ) دون الحاجة لملفات خارجية
    function playSound(isCorrect) {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (isCorrect) {
                // نغمة نجاح تصاعدية
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else {
                // نغمة خطأ منخفضة
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                osc.frequency.setValueAtTime(150, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            }
        } catch(e) { console.log(e); }
    }

    function openRoom(className) {
        selectedClassName = className;
        document.getElementById("room-title-setup").innerText = `إدارة غرفة: ${className}`;
        document.getElementById("rooms-section").classList.add("hidden");
        document.getElementById("setup-section").classList.remove("hidden");
    }

    async function handleFiles(event, targetId) {
        const files = event.target.files;
        if (!files || files.length === 0) return;

        let combinedText = document.getElementById(targetId).value;
        if (combinedText && !combinedText.endsWith('\n')) combinedText += '\n';

        for (let i = 0; i < files.length; i++) {
            const file = files[i];
            if (file.type === "application/pdf") {
                await readPDFFile(file, function(pdfText) {
                    if(targetId === 'students-input') {
                        document.getElementById(targetId).value += cleanStudentNames(pdfText) + '\n';
                    } else {
                        document.getElementById(targetId).value += pdfText + '\n';
                    }
                });
            } else {
                await readTextFile(file, function(txtText) {
                    if(targetId === 'students-input') {
                        document.getElementById(targetId).value += cleanStudentNames(txtText) + '\n';
                    } else {
                        document.getElementById(targetId).value += txtText + '\n';
                    }
                });
            }
        }
    }

    // تنظيف أسماء الطلاب وفلترتها بدقة من ترويسات الـ PDF
    function cleanStudentNames(rawText) {
        let lines = rawText.split('\n').map(l => l.trim());
        let validNames = [];
        for (let line of lines) {
            // استبعاد الأسطر التي تحتوي على كلمات ترويسة أو أرقام صفحات أو أحرف قصيرة جداً
            if (line.length > 5 && 
                !line.includes("إدارة") && 
                !line.includes("الدراسي") && 
                !line.includes("الصف") && 
                !line.includes("المدرسين") && 
                !line.includes("السعي") &&
                !line.includes("الفصل")) {
                
                // إزالة الأرقام المسلسلة في بداية السطر (مثل "1 أحمد" أو "12- حارث")
                let cleaned = line.replace(/^\d+[\s\-–\.]+/g, '').trim();
                if (cleaned.length > 5) validNames.push(cleaned);
            }
        }
        return validNames.join('\n');
    }

    function readTextFile(file, callback) {
        const reader = new FileReader();
        reader.onload = function(e) { callback(e.target.result); };
        reader.readAsText(file, "UTF-8");
    }

    function readPDFFile(file, callback) {
        const reader = new FileReader();
        reader.onload = function() {
            const typedarray = new Uint8Array(this.result);
            pdfjsLib.getDocument(typedarray).promise.then(function(pdfDoc) {
                let textPromises = [];
                for (let j = 1; j <= pdfDoc.numPages; j++) {
                    textPromises.push(
                        pdfDoc.getPage(j).then(function(page) {
                            return page.getTextContent().then(function(textContent) {
                                return textContent.items.map(item => item.str).join(' ');
                            });
                        })
                    );
                }
                Promise.all(textPromises).then(function(pagesText) {
                    callback(pagesText.join('\n'));
                });
            }).catch(error => console.error(error));
        };
        reader.readAsArrayBuffer(file);
    }

    function startExam() {
        const studentsText = document.getElementById("students-input").value.trim();
        const lectureText = document.getElementById("lecture-input").value.trim();

        if(!studentsText) {
            alert("يرجى إرفاق ملف أسماء الطلاب أولاً!");
            return;
        }
        if(!lectureText) {
            alert("يرجى إرفاق ملف المحاضرة والأسئلة أولاً!");
            return;
        }

        studentsList = studentsText.split('\n').map(s => s.trim()).filter(s => s.length > 3);
        
        // استخراج الأسئلة وتوليد خيارات لها تلقائياً
        let rawLines = lectureText.split('\n').map(q => q.trim()).filter(q => q.length > 5);
        questionsList = rawLines.map((line, idx) => {
            let qText = line.startsWith("س:") ? line : "س: " + line;
            return {
                question: qText,
                options: [
                    "الإجابة الصحيحة أو النموذجية",
                    "خيار غير صحيح أول",
                    "خيار خاطئ ثانٍ",
                    "خيار خاطئ ثالث"
                ].sort(() => Math.random() - 0.5) // خلط الخيارات عشوائياً
            };
        });

        if(studentsList.length === 0 || questionsList.length === 0) {
            alert("تعذر استخراج بيانات كافية، يرجى التأكد من محتوى الملفات.");
            return;
        }

        document.getElementById("room-title-exam").innerText = `غرفة امتحان: ${selectedClassName}`;
        document.getElementById("setup-section").classList.add("hidden");
        document.getElementById("exam-section").classList.remove("hidden");
        document.getElementById("alert-banner").style.display = "none";

        studentIndex = -1;
        questionIndex = 0;
        document.getElementById("results-table-body").innerHTML = "";
        nextStep();
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = 45;
        document.getElementById("timer-display").innerText = `الوقت المتبقي: ${timeLeft} ثانية`;
        
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById("timer-display").innerText = `الوقت المتبقي: ${timeLeft} ثانية`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                playSound(false);
                evaluateAnswer(false, "انتهى الوقت (خطأ تلقائي)");
            }
        }, 1000);
    }

    function nextStep() {
        studentIndex++;
        if (studentIndex >= studentsList.length) {
            document.getElementById("current-student").innerText = "انتهت قائمة طلاب هذه الغرفة بنجاح! 🎓";
            document.getElementById("current-question").innerText = "اكتملت جميع الأسئلة.";
            document.getElementById("options-container").innerHTML = "";
            document.getElementById("alert-banner").style.display = "none";
            clearInterval(timer);
            return;
        }

        const currentStudent = studentsList[studentIndex];
        currentQObj = questionsList[questionIndex % questionsList.length];
        questionIndex++;

        document.getElementById("current-student").innerText = `الطالب: ${currentStudent}`;
        document.getElementById("current-question").innerText = currentQObj.question;
        document.getElementById("alert-banner").style.display = "none";

        // عرض الاختيارات الأربعة تحت السؤال
        const optContainer = document.getElementById("options-container");
        optContainer.innerHTML = "";
        
        // لنفترض أن الخيار الأول دائماً هو الصحيح قبل خلطه أو نحدد الصحيح بناءً على النص
        const correctOpt = "الإجابة الصحيحة أو النموذجية";
        
        currentQObj.options.forEach((opt, idx) => {
            const btn = document.createElement("button");
            btn.className = "option-btn";
            btn.innerText = `${['أ', 'ب', 'ج', 'د'][idx]}) ${opt}`;
            btn.onclick = function() {
                // التحقق هل الإجابة هي الصحيحة
                const isCorrect = (opt === correctOpt);
                evaluateAnswer(isCorrect, opt);
            };
            optContainer.appendChild(btn);
        });

        startTimer();
    }

    function evaluateAnswer(isCorrect, chosenOpt) {
        clearInterval(timer);
        if (studentIndex < 0 || studentIndex >= studentsList.length) return;

        const studentName = studentsList[studentIndex];
        const banner = document.getElementById("alert-banner");
        let statusText = "";

        playSound(isCorrect); // تشغيل رنة النجاح أو الخطأ

        if (isCorrect) {
            banner.className = "alert-success";
            banner.innerText = `✔️ إجابة صحيحة! (${chosenOpt}) - تمت إضافة (+3) درجات.`;
            statusText = "✔️ صح (+3)";
        } else {
            banner.className = "alert-danger";
            banner.innerText = `❌ إجابة خاطئة! - تم تسجيل (0) درجات.`;
            statusText = "❌ خطأ (0)";
        }
        banner.style.display = "block";

        const tableBody = document.getElementById("results-table-body");
        const newRow = document.createElement("tr");
        newRow.innerHTML = `<td>${studentName}</td><td style="font-size:13px; color:#475569;">${currentQObj.question}</td><td>${statusText}</td>`;
        tableBody.appendChild(newRow);

        setTimeout(() => {
            nextStep();
        }, 1800);
    }

    function backToRooms() {
        clearInterval(timer);
        document.getElementById("setup-section").classList.add("hidden");
        document.getElementById("rooms-section").classList.remove("hidden");
        document.getElementById("students-input").value = "";
        document.getElementById("lecture-input").value = "";
        document.getElementById("students-files").value = "";
        document.getElementById("lecture-files").value = "";
    }

    function resetAndBackToRooms() {
        clearInterval(timer);
        document.getElementById("exam-section").classList.add("hidden");
        document.getElementById("rooms-section").classList.remove("hidden");
        document.getElementById("students-input").value = "";
        document.getElementById("lecture-input").value = "";
        document.getElementById("students-files").value = "";
        document.getElementById("lecture-files").value = "";
        document.getElementById("results-table-body").innerHTML = "";
        document.getElementById("alert-banner").style.display = "none";
    }
</script>

</body>
</html>
