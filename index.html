<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة امتحانات الحاسوب الذكية</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f1f5f9; color: #0f172a; padding: 15px; max-width: 650px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .header { text-align: center; margin-bottom: 20px; background: #ffffff; padding: 15px; border-radius: 12px; }
        h2 { color: #1e293b; margin-bottom: 5px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #334155; }
        select, input[type="file"] { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 1rem; margin-bottom: 15px; background: #fff; box-sizing: border-box; }
        .question { font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; color: #334155; }
        .options button { display: block; width: 100% !important; text-align: right; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .options button:hover { background: #f8fafc; }
        .correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534; font-weight: bold; }
        .wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .btn-primary { background: #0284c7; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-primary:hover { background: #0369a1; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; font-size: 0.95rem; }
        th { background: #0284c7; color: white; }
        tr:nth-child(even) { background: #f8fafc; }
    </style>
</head>
<body>

    <div class="header">
        <h2>منصة امتحانات الحاسوب الذكية</h2>
        <p style="color: #64748b; font-size: 1rem;">اختر الصف والشعبة وارفع ملفاتك للبدء الفوري</p>
    </div>

    <!-- خطوة 1: اختيار الصف والشعبة ورفع الملفات -->
    <div id="setup-card" class="card">
        <label for="grade-select">اختر الصف:</label>
        <select id="grade-select">
            <option value="">-- اختر الصف --</option>
            <option value="الرابع">الصف الرابع</option>
            <option value="الخامس">الصف الخامس</option>
        </select>

        <label for="section-select">اختر الشعبة:</label>
        <select id="section-select">
            <option value="">-- اختر الشعبة --</option>
            <option value="أ">شعبة (أ)</option>
            <option value="ب">شعبة (ب)</option>
        </select>

        <label for="students-file">ارفع ملف أسماء الطلاب (ملف نصي .txt - اسم في كل سطر):</label>
        <input type="file" id="students-file" accept=".txt">

        <label for="questions-file">ارفع ملف الأسئلة (ملف JSON أو نصي):</label>
        <input type="file" id="questions-file" accept=".json,.txt">

        <label for="student-select">اختر اسم الطالب (بعد رفع الملف):</label>
        <select id="student-select">
            <option value="">-- ارفع ملف الأسماء أولاً --</option>
        </select>

        <button class="btn-primary" onclick="startExam()">بدء الامتحان</button>
    </div>

    <!-- خطوة 2: واجهة الامتحان والتصحيح الفوري -->
    <div id="exam-card" class="card" style="display: none;">
        <h3 id="current-info" style="color: #0284c7; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;"></h3>
        <div id="quiz-container"></div>
    </div>

    <!-- خطوة 3: جدول النتائج -->
    <div class="card">
        <h3 style="color: #1e293b; margin-bottom: 10px;">سجل درجات الطلاب والنتائج المباشرة</h3>
        <div style="overflow-x: auto;">
            <table id="results-table">
                <thead>
                    <tr>
                        <th>اسم الطالب</th>
                        <th>الصف والشعبة</th>
                        <th>الدرجة من 10</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr>
                        <td colspan="3" style="color: #94a3b8;">لا توجد نتائج مسجلة حتى الآن</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let loadedStudents = [];
        let loadedQuestions = [];
        let selectedGrade = "";
        let selectedSection = "";
        let currentStudent = "";
        let selectedQuestions = [];
        let score = 0;
        let answeredCount = 0;
        let allResults = [];

        // قراءة ملف أسماء الطلاب (كل اسم في سطر)
        document.getElementById('students-file').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(event) {
                let lines = event.target.result.split(/\r\n|\n/);
                loadedStudents = lines.filter(name => name.trim() !== "");
                let studentSelect = document.getElementById('student-select');
                studentSelect.innerHTML = '<option value="">-- اختر اسم الطالب --</option>';
                loadedStudents.forEach(name => {
                    let opt = document.createElement('option');
                    opt.value = name;
                    opt.innerText = name;
                    studentSelect.appendChild(opt);
                });
                alert("تم تحميل أسماء الطلاب بنجاح!");
            };
            reader.readAsText(file, "UTF-8");
        });

        // قراءة ملف الأسئلة (افتراضي بصيغة JSON أو سنضع أسئلة افتراضية إذا لم يتم الرفع)
        document.getElementById('questions-file').addEventListener('change', function(e) {
            let file = e.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(event) {
                try {
                    loadedQuestions = JSON.parse(event.target.result);
                    alert("تم تحميل بنك الأسئلة بنجاح!");
                } catch (err) {
                    alert("خطأ في صيغة ملف الأسئلة. يجب أن يكون بصيغة JSON مطابقة.");
                }
            };
            reader.readAsText(file, "UTF-8");
        });

        // بنك أسئلة احتياطي في حال لم يرفع المستخدم ملف أسئلة خارجي لتجربة النظام فوراً
        const defaultQuestions = [
            {
                q: "ما هو مفهوم تطبيقات الأجهزة الذكية؟",
                options: [
                    "أ) برامج مخصصة لتشغيل الأجهزة المكتبية فقط",
                    "ب) برامج مكتوبة بلغات برمجية تتوافق مع أنظمة تشغيل الأجهزة الذكية وتقدم خدمات في شتى المجالات",
                    "ج) ملفات نصية لتخزين البيانات فقط",
                    "د) أجهزة مادية لإدارة الاتصال بالإنترنت"
                ],
                correct: 1
            },
            {
                q: "من مميزات تطبيقات الأجهزة الذكية التخزين الداخلي حيث تخزن في ذاكرة الجهاز لتأدية:",
                options: [
                    "أ) مهام مصممة لأجلها مثل تطبيقات الطقس",
                    "ب) ألعاب فيديو فقط",
                    "ج) ملفات نظام التشغيل الأساسية فقط",
                    "د) نسخ احتياطية للنظام القديم"
                ],
                correct: 0
            },
            {
                q: "تتطلب بعض تطبيقات الأجهزة الذكية إنترنت لـ:",
                options: [
                    "أ) حذف الملفات المؤقتة تلقائياً",
                    "ب) تحديث المحتوى وتفعيل التزامن بين جهازين",
                    "ج) زيادة مساحة القرص الصلب",
                    "د) تشغيل مروحة المعالج"
                ],
                correct: 1
            },
            {
                q: "من الخصائص التشغيلية لتطبيقات الأجهزة الذكية التفاعل المباشر مع عتاد الجهاز مثل:",
                options: [
                    "أ) الكاميرا، البوصلة، GPS، مكبر الصوت والبيانات الشخصية",
                    "ب) مزود الطاقة فقط",
                    "ج) القرص الصلب الخارجي فقط",
                    "د) كابلات الشحن"
                ],
                correct: 0
            }
        ];

        function startExam() {
            selectedGrade = document.getElementById('grade-select').value;
            selectedSection = document.getElementById('section-select').value;
            currentStudent = document.getElementById('student-select').value;

            if (!selectedGrade || !selectedSection || !currentStudent) {
                alert("الرجاء اختيار الصف، الشعبة، واسم الطالب بالكامل!");
                return;
            }

            let activeQuestions = (loadedQuestions.length > 0) ? loadedQuestions : defaultQuestions;

            // اختيار 3 أسئلة عشوائية للطالب
            selectedQuestions = [...activeQuestions].sort(() => 0.5 - Math.random()).slice(0, 3);
            score = 0;
            answeredCount = 0;

            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('exam-card').style.display = 'block';
            document.getElementById('current-info').innerText = `الطالب: ${currentStudent} | ${selectedGrade} - شعبة (${selectedSection})`;

            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = "";

            selectedQuestions.forEach((item, index) => {
                let card = document.createElement('div');
                card.style.marginBottom = "20px";
                
                let qTitle = document.createElement('div');
                qTitle.className = 'question';
                qTitle.innerText = `س ${index + 1}: ${item.q}`;
                card.appendChild(qTitle);

                let optDiv = document.createElement('div');
                optDiv.className = 'options';

                item.options.forEach((opt, optIndex) => {
                    let btn = document.createElement('button');
                    btn.innerText = opt;
                    btn.onclick = function() {
                        let buttons = optDiv.querySelectorAll('button');
                        buttons.forEach(b => b.disabled = true); // قفل الأزرار فور الاختيار
                        
                        if (optIndex === item.correct) {
                            btn.classList.add('correct');
                            score++;
                        } else {
                            btn.classList.add('wrong');
                            buttons[item.correct].classList.add('correct'); // تلوين الإجابة الصحيحة باللون الأخضر
                        }
                        
                        answeredCount++;
                        if (answeredCount === selectedQuestions.length) {
                            setTimeout(finishExam, 1000);
                        }
                    };
                    optDiv.appendChild(btn);
                });

                card.appendChild(optDiv);
                container.appendChild(card);
            });
        }

        function finishExam() {
            let finalGrade10 = Math.round((score / selectedQuestions.length) * 10);
            let fullSectionName = `${selectedGrade} - شعبة (${selectedSection})`;

            allResults.push({
                name: currentStudent,
                section: fullSectionName,
                grade: finalGrade10
            });

            updateResultsTable();

            alert(`انتهى الامتحان يا ${currentStudent}!\nدرجتك النهائية هي: ${finalGrade10} من 10`);

            document.getElementById('exam-card').style.display = 'none';
            document.getElementById('setup-card').style.display = 'block';
            document.getElementById('student-select').value = "";
        }

        function updateResultsTable() {
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = "";

            if (allResults.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color: #94a3b8;">لا توجد نتائج مسجلة حتى الآن</td></tr>';
                return;
            }

            allResults.forEach(res => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td>${res.name}</td>
                    <td>${res.section}</td>
                    <td><strong>${res.grade} / 10</strong></td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
