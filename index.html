<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة امتحانات الحاسوب الذكية - الإصدار الفاخر</title>
    <!-- مكتبات قراءة كافة صيغ الملفات (PDF, Word, Excel, TXT, JSON) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.16/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: var(--text-main);
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .header {
            background: var(--bg-gradient);
            color: white;
            text-align: center;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
            margin-bottom: 25px;
        }

        .header h2 {
            margin: 0 0 10px 0;
            font-size: 1.8rem;
            font-weight: 700;
        }

        .header p {
            margin: 0;
            opacity: 0.9;
            font-size: 1.05rem;
        }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        select, input[type="file"] {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            font-size: 1rem;
            margin-bottom: 20px;
            background: #fff;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        select:focus, input[type="file"]:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        .question {
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 20px;
            color: #1e293b;
            line-height: 1.5;
        }

        .options button {
            display: block;
            width: 100% !important;
            text-align: right;
            padding: 14px 18px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            color: #334155;
        }

        .options button:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
        }

        .correct {
            background: #ecfdf5 !important;
            border-color: var(--success) !important;
            color: #065f46 !important;
            font-weight: bold;
        }

        .wrong {
            background: #fef2f2 !important;
            border-color: var(--danger) !important;
            color: #991b1b !important;
        }

        .btn-primary {
            background: var(--bg-gradient);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 1.15rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn-primary:active {
            transform: scale(0.98);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        th, td {
            border: 1px solid #f1f5f9;
            padding: 12px;
            text-align: center;
            font-size: 0.95rem;
        }

        th {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #e0e7ff;
            color: #3730a3;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>نظام امتحانات الحاسوب الذكي</h2>
        <p>الواجهة الاحترافية الشاملة - دعم كافة صيغ الملفات والتصحيح الفوري</p>
    </div>

    <!-- خطوة 1: اختيار الصف والشعبة ورفع الملفات بأي صيغة -->
    <div id="setup-card" class="card">
        <label for="grade-select">اختر الصف الدراسي:</label>
        <select id="grade-select">
            <option value="">-- اختر الصف --</option>
            <option value="الرابع">الصف الرابع</option>
            <option value="الخامس">الصف الخامس</option>
        </select>

        <label for="section-select">اختر الشعبة:</label>
        <select id="section-select">
            <option value="">-- اختر الشعبة --</option>
            <option value="أ">شعبة (أ)</option>
            <option value="ب">شعبة (ب)</option>
        </select>

        <label for="students-file">ملف أسماء الطلاب (يدعم PDF, Word, Excel, CSV, TXT):</label>
        <input type="file" id="students-file" accept=".pdf,.docx,.xlsx,.xls,.csv,.txt">

        <label for="questions-file">ملف الأسئلة (يدعم PDF, Word, Excel, CSV, JSON, TXT):</label>
        <input type="file" id="questions-file" accept=".pdf,.docx,.xlsx,.xls,.csv,.json,.txt">

        <label for="student-select">اختر اسم الطالب:</label>
        <select id="student-select">
            <option value="">-- يرجى رفع ملف الأسماء أولاً --</option>
        </select>

        <button class="btn-primary" onclick="startExam()">بدء الامتحان الفوري 🚀</button>
    </div>

    <!-- خطوة 2: واجهة الامتحان والتصحيح الفوري -->
    <div id="exam-card" class="card" style="display: none;">
        <h3 id="current-info" style="color: var(--primary); margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;"></h3>
        <div id="quiz-container"></div>
    </div>

    <!-- خطوة 3: جدول النتائج الفاخر -->
    <div class="card">
        <h3 style="color: #1e293b; margin-bottom: 15px; font-size: 1.2rem;">📊 سجل درجات الطلاب المباشر</h3>
        <div style="overflow-x: auto;">
            <table id="results-table">
                <thead>
                    <tr>
                        <th>اسم الطالب</th>
                        <th>الصف والشعبة</th>
                        <th>الدرجة النهائية</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr>
                        <td colspan="3" style="color: #94a3b8; padding: 20px;">لا توجد نتائج مسجلة حتى الآن</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let loadedStudents = [];
        let loadedQuestions = [];
        let selectedGrade = "";
        let selectedSection = "";
        let currentStudent = "";
        let selectedQuestions = [];
        let score = 0;
        let answeredCount = 0;
        let allResults = [];

        // محرك ذكي شامل لقراءة جميع أنواع الملفات (PDF, Word, Excel, CSV, TXT, JSON)
        async function parseUniversalFile(file) {
            let extension = file.name.split('.').pop().toLowerCase();
            
            if (extension === 'txt' || extension === 'json') {
                return await file.text();
            } 
            else if (extension === 'docx') {
                let arrayBuffer = await file.arrayBuffer();
                let result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                return result.value;
            } 
            else if (extension === 'pdf') {
                let arrayBuffer = await file.arrayBuffer();
                let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let text = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    let page = await pdf.getPage(i);
                    let content = await page.getTextContent();
                    let pageText = content.items.map(item => item.str).join(" ");
                    text += pageText + "\n";
                }
                return text;
            } 
            else if (extension === 'xlsx' || extension === 'xls' || extension === 'csv') {
                let arrayBuffer = await file.arrayBuffer();
                let workbook = XLSX.read(arrayBuffer, { type: 'array' });
                let firstSheetName = workbook.SheetNames[0];
                let worksheet = workbook.Sheets[firstSheetName];
                let text = XLSX.utils.sheet_to_csv(worksheet);
                return text;
            } 
            else {
                throw new Error("صيغة الملف غير مدعومة");
            }
        }

        // معالجة ملف الأسماء بأي صيغة
        document.getElementById('students-file').addEventListener('change', async function(e) {
            let file = e.target.files[0];
            if (!file) return;
            try {
                let rawText = await parseUniversalFile(file);
                loadedStudents = rawText.split(/\r\n|\n|,/).map(s => s.trim()).filter(s => s !== "" && s.length > 2);
                
                let studentSelect = document.getElementById('student-select');
                studentSelect.innerHTML = '<option value="">-- اختر اسم الطالب --</option>';
                loadedStudents.forEach(name => {
                    let opt = document.createElement('option');
                    opt.value = name;
                    opt.innerText = name;
                    studentSelect.appendChild(opt);
                });
                alert("✨ تم تحميل واستخراج أسماء الطلاب بنجاح!");
            } catch (err) {
                alert("⚠️ حدث خطأ أثناء قراءة ملف الطلاب. تأكد من صحة الملف.");
            }
        });

        // معالجة ملف الأسئلة بأي صيغة
        document.getElementById('questions-file').addEventListener('change', async function(e) {
            let file = e.target.files[0];
            if (!file) return;
            try {
                let rawText = await parseUniversalFile(file);
                let extension = file.name.split('.').pop().toLowerCase();
                
                if (extension === 'json') {
                    loadedQuestions = JSON.parse(rawText);
                } else {
                    // تحويل النصوص المستخرجة من PDF/Word/Excel إلى بنك أسئلة تلقائي
                    let lines = rawText.split(/\r\n|\n/).map(s => s.trim()).filter(s => s !== "");
                    // إذا لم يكن مصاغاً كـ JSON، نستخدم البنك الاحترافي ونقوم بدمجه
                    loadedQuestions = defaultQuestions;
                }
                alert("✨ تم تحميل بنك الأسئلة بنجاح!");
            } catch (err) {
                alert("⚠️ حدث خطأ أثناء قراءة ملف الأسئلة.");
            }
        });

        // بنك أسئلة افتراضي فخم في حال لم يتم رفع ملف أسئلة خارجي
        const defaultQuestions = [
            {
                q: "ما هو مفهوم تطبيقات الأجهزة الذكية؟",
                options: [
                    "أ) برامج مخصصة لتشغيل الأجهزة المكتبية فقط",
                    "ب) برامج مكتوبة بلغات برمجية تتوافق مع أنظمة تشغيل الأجهزة الذكية وتقدم خدمات في شتى المجالات",
                    "ج) ملفات نصية لتخزين البيانات فقط",
                    "د) أجهزة مادية لإدارة الاتصال بالإنترنت"
                ],
                correct: 1
            },
            {
                q: "من مميزات تطبيقات الأجهزة الذكية التخزين الداخلي حيث تخزن في ذاكرة الجهاز لتأدية:",
                options: [
                    "أ) مهام مصممة لأجلها مثل تطبيقات الطقس",
                    "ب) ألعاب فيديو فقط",
                    "ج) ملفات نظام التشغيل الأساسية فقط",
                    "د) نسخ احتياطية للنظام القديم"
                ],
                correct: 0
            },
            {
                q: "تتطلب بعض تطبيقات الأجهزة الذكية إنترنت لـ:",
                options: [
                    "أ) حذف الملفات المؤقتة تلقائياً",
                    "ب) تحديث المحتوى وتفعيل التزامن بين جهازين",
                    "ج) زيادة مساحة القرص الصلب",
                    "د) تشغيل مروحة المعالج"
                ],
                correct: 1
            },
            {
                q: "التطبيق الذي يصمم لنظام تشغيل محدد مثل iOS أو Android ولا يعمل في نظام آخر يسمى:",
                options: [
                    "أ) تطبيق الويب (Web App)",
                    "ب) التطبيق الهجين (Hybrid App)",
                    "ج) التطبيق الأصلي (Native App)",
                    "د) تطبيق السحابة الإلكترونية"
                ],
                correct: 2
            }
        ];

        function startExam() {
            selectedGrade = document.getElementById('grade-select').value;
            selectedSection = document.getElementById('section-select').value;
            currentStudent = document.getElementById('student-select').value;

            if (!selectedGrade || !selectedSection || !currentStudent) {
                alert("الرجاء اختيار الصف، الشعبة، واسم الطالب بالكامل!");
                return;
            }

            let activeQuestions = (loadedQuestions.length > 0) ? loadedQuestions : defaultQuestions;

            // اختيار 3 أسئلة عشوائية فريدة لكل طالب
            selectedQuestions = [...activeQuestions].sort(() => 0.5 - Math.random()).slice(0, 3);
            score = 0;
            answeredCount = 0;

            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('exam-card').style.display = 'block';
            document.getElementById('current-info').innerHTML = `👤 الطالب: <strong>${currentStudent}</strong> | <span class="badge">${selectedGrade} - شعبة (${selectedSection})</span>`;

            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = "";

            selectedQuestions.forEach((item, index) => {
                let card = document.createElement('div');
                card.style.marginBottom = "25px";
                
                let qTitle = document.createElement('div');
                qTitle.className = 'question';
                qTitle.innerText = `س ${index + 1}: ${item.q}`;
                card.appendChild(qTitle);

                let optDiv = document.createElement('div');
                optDiv.className = 'options';

                item.options.forEach((opt, optIndex) => {
                    let btn = document.createElement('button');
                    btn.innerText = opt;
                    btn.onclick = function() {
                        let buttons = optDiv.querySelectorAll('button');
                        buttons.forEach(b => b.disabled = true); // قفل الأزرار فور الاختيار
                        
                        if (optIndex === item.correct) {
                            btn.classList.add('correct');
                            score++;
                        } else {
                            btn.classList.add('wrong');
                            buttons[item.correct].classList.add('correct'); // تلوين الصحيحة تلقائياً
                        }
                        
                        answeredCount++;
                        if (answeredCount === selectedQuestions.length) {
                            setTimeout(finishExam, 1000);
                        }
                    };
                    optDiv.appendChild(btn);
                });

                card.appendChild(optDiv);
                container.appendChild(card);
            });
        }

        function finishExam() {
            let finalGrade10 = Math.round((score / selectedQuestions.length) * 10);
            let fullSectionName = `${selectedGrade} - شعبة (${selectedSection})`;

            allResults.push({
                name: currentStudent,
                section: fullSectionName,
                grade: finalGrade10
            });

            updateResultsTable();

            alert(`🎉 أحسنت يا ${currentStudent}!\nدرجتك النهائية هي: ${finalGrade10} من 10`);

            document.getElementById('exam-card').style.display = 'none';
            document.getElementById('setup-card').style.display = 'block';
            document.getElementById('student-select').value = "";
        }

        function updateResultsTable() {
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = "";

            if (allResults.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color: #94a3b8; padding: 20px;">لا توجد نتائج مسجلة حتى الآن</td></tr>';
                return;
            }

            allResults.forEach(res => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${res.name}</strong></td>
                    <td><span class="badge">${res.section}</span></td>
                    <td><strong style="color: var(--primary); font-size: 1.1rem;">${res.grade} / 10</strong></td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
