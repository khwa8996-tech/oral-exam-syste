<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة امتحانات الحاسوب الذكية - النظام الشامل</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f1f5f9; color: #0f172a; padding: 15px; max-width: 650px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .header { text-align: center; margin-bottom: 20px; background: #ffffff; padding: 15px; border-radius: 12px; }
        h2 { color: #1e293b; margin-bottom: 5px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; color: #334155; }
        select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #cbd5e1; font-size: 1rem; margin-bottom: 15px; background: #fff; }
        .question { font-weight: bold; font-size: 1.1rem; margin-bottom: 15px; color: #334155; }
        .options button { display: block; width: 100% !important; text-align: right; padding: 12px; margin: 8px 0; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        .options button:hover { background: #f8fafc; }
        .correct { background: #dcfce7 !important; border-color: #22c55e !important; color: #166534; font-weight: bold; }
        .wrong { background: #fee2e2 !important; border-color: #ef4444 !important; color: #991b1b; }
        .btn-primary { background: #0284c7; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 1.1rem; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-primary:hover { background: #0369a1; }
        
        /* جدول النتائج */
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: center; font-size: 0.95rem; }
        th { background: #0284c7; color: white; }
        tr:nth-child(even) { background: #f8fafc; }
    </style>
</head>
<body>

    <div class="header">
        <h2>نظام امتحانات الحاسوب الذكي</h2>
        <p style="color: #64748b; font-size: 1rem;">التصحيح الفوري وإدارة الشعب المستقلة</p>
    </div>

    <!-- 1. بوابة اختيار الشعبة واسم الطالب -->
    <div id="setup-card" class="card">
        <label for="section-select">اختر الشعبة أو البوابة:</label>
        <select id="section-select">
            <option value="">-- اضغط لاختيار الشعبة --</option>
            <option value="الرابع (أ)">الرابع (أ)</option>
            <option value="الرابع (ب)">الرابع (ب)</option>
            <option value="الخامس (أ)">الخامس (أ)</option>
            <option value="الخامس (ب)">الخامس (ب)</option>
        </select>

        <label for="student-select">اختر اسم الطالب:</label>
        <select id="student-select">
            <option value="">-- اختر الشعبة أولاً --</option>
        </select>

        <button class="btn-primary" onclick="startExam()">دخول الامتحان</button>
    </div>

    <!-- 2. واجهة الأسئلة -->
    <div id="exam-card" class="card" style="display: none;">
        <h3 id="current-info" style="color: #0284c7; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 8px;"></h3>
        <div id="quiz-container"></div>
    </div>

    <!-- 3. لوحة سجل الدرجات والنتائج لكل شعبة -->
    <div class="card">
        <h3 style="color: #1e293b; margin-bottom: 10px;">سجل درجات الطلاب (نتائج الشعبة)</h3>
        <div style="overflow-x: auto;">
            <table id="results-table">
                <thead>
                    <tr>
                        <th>اسم الطالب</th>
                        <th>الصف والشعبة</th>
                        <th>الدرجة من 10</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr>
                        <td colspan="3" style="color: #94a3b8;">لا توجد نتائج مسجلة حتى الآن</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // قاعدة بيانات أسماء الطلاب حسب الشعبة (يمكنك إضافة أو تعديل الأسماء هنا بكل سهولة)
        const studentsData = {
            "الرابع (أ)": ["أحمد محمد علي", "حسين جاسم", "فاطمة كريم", "موسى كاظم"],
            "الرابع (ب)": ["زينب عبد الله", "حسن علي", "سارة أحمد", "علي رضا"],
            "الخامس (أ)": ["محمد باقر", "زهراء حسن", "مصطفى عادل", "نور الهدى"],
            "الخامس (ب)": ["كرار حيدر", "بنين محمد", "سجاد علي", "آية حسين"]
        };

        // بنك الأسئلة الشامل (يمكنك إضافة بقية الـ 107 أسئلة هنا)
        const allQuestions = [
            {
                q: "ما هو مفهوم تطبيقات الأجهزة الذكية؟",
                options: [
                    "أ) برامج مخصصة لتشغيل الأجهزة المكتبية فقط",
                    "ب) برامج مكتوبة بلغات برمجية تتوافق مع أنظمة تشغيل الأجهزة الذكية وتقدم خدمات في شتى المجالات",
                    "ج) ملفات نصية لتخزين البيانات فقط",
                    "د) أجهزة مادية لإدارة الاتصال بالإنترنت"
                ],
                correct: 1
            },
            {
                q: "من مميزات تطبيقات الأجهزة الذكية التخزين الداخلي حيث تخزن في ذاكرة الجهاز لتأدية:",
                options: [
                    "أ) مهام مصممة لأجلها مثل تطبيقات الطقس",
                    "ب) ألعاب فيديو فقط",
                    "ج) ملفات نظام التشغيل الأساسية فقط",
                    "د) نسخ احتياطية للنظام القديم"
                ],
                correct: 0
            },
            {
                q: "تتطلب بعض تطبيقات الأجهزة الذكية إنترنت لـ:",
                options: [
                    "أ) حذف الملفات المؤقتة تلقائياً",
                    "ب) تحديث المحتوى وتفعيل التزامن بين جهازين",
                    "ج) زيادة مساحة القرص الصلب",
                    "د) تشغيل مروحة المعالج"
                ],
                correct: 1
            },
            {
                q: "من الخصائص التشغيلية لتطبيقات الأجهزة الذكية التفاعل المباشر مع عتاد الجهاز مثل:",
                options: [
                    "أ) الكاميرا، البوصلة، GPS، مكبر الصوت والبيانات الشخصية",
                    "ب) مزود الطاقة فقط",
                    "ج) القرص الصلب الخارجي فقط",
                    "د) كابلات الشحن"
                ],
                correct: 0
            },
            {
                q: "التطبيق الذي يصمم لنظام تشغيل محدد مثل iOS أو Android ولا يعمل في نظام آخر يسمى:",
                options: [
                    "أ) تطبيق الويب (Web App)",
                    "ب) التطبيق الهجين (Hybrid App)",
                    "ج) التطبيق الأصلي (Native App)",
                    "د) تطبيق السحابة الإلكترونية"
                ],
                correct: 2
            }
        ];

        let currentSection = "";
        let currentStudent = "";
        let selectedQuestions = [];
        let score = 0;
        let answeredCount = 0;
        let allResults = [];

        // تحديث قائمة الطلاب بناءً على اختيار الشعبة
        document.getElementById('section-select').addEventListener('change', function() {
            let section = this.value;
            let studentSelect = document.getElementById('student-select');
            studentSelect.innerHTML = '<option value="">-- اختر اسم الطالب --</option>';
            
            if (section && studentsData[section]) {
                studentsData[section].forEach(name => {
                    let opt = document.createElement('option');
                    opt.value = name;
                    opt.innerText = name;
                    studentSelect.appendChild(opt);
                });
            }
        });

        function startExam() {
            currentSection = document.getElementById('section-select').value;
            currentStudent = document.getElementById('student-select').value;

            if (!currentSection || !currentStudent) {
                alert("الرجاء اختيار الشعبة واسم الطالب أولاً!");
                return;
            }

            // اختيار 3 أسئلة عشوائية فريدة لكل طالب
            selectedQuestions = [...allQuestions].sort(() => 0.5 - Math.random()).slice(0, 3);
            score = 0;
            answeredCount = 0;

            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('exam-card').style.display = 'block';
            document.getElementById('current-info').innerText = `الطالب: ${currentStudent} | الشعبة: ${currentSection}`;

            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = "";

            selectedQuestions.forEach((item, index) => {
                let card = document.createElement('div');
                card.style.marginBottom = "20px";
                
                let qTitle = document.createElement('div');
                qTitle.className = 'question';
                qTitle.innerText = `س ${index + 1}: ${item.q}`;
                card.appendChild(qTitle);

                let optDiv = document.createElement('div');
                optDiv.className = 'options';

                item.options.forEach((opt, optIndex) => {
                    let btn = document.createElement('button');
                    btn.innerText = opt;
                    btn.onclick = function() {
                        let buttons = optDiv.querySelectorAll('button');
                        buttons.forEach(b => b.disabled = true); // قفل الأزرار فور الاختيار
                        
                        if (optIndex === item.correct) {
                            btn.classList.add('correct');
                            score++;
                        } else {
                            btn.classList.add('wrong');
                            buttons[item.correct].classList.add('correct'); // تلوين الإجابة الصحيحة باللون الأخضر تلقائياً
                        }
                        
                        answeredCount++;
                        if (answeredCount === selectedQuestions.length) {
                            setTimeout(finishExam, 1000);
                        }
                    };
                    optDiv.appendChild(btn);
                });

                card.appendChild(optDiv);
                container.appendChild(card);
            });
        }

        function finishExam() {
            // احتساب الدرجة من 10 بناءً على الإجابات الصحيحة من أصل 3 أسئلة
            let finalGrade10 = Math.round((score / selectedQuestions.length) * 10);

            allResults.push({
                name: currentStudent,
                section: currentSection,
                grade: finalGrade10
            });

            updateResultsTable();

            alert(`انتهى الاختبار يا ${currentStudent}!\nدرجتك النهائية هي: ${finalGrade10} من 10`);

            document.getElementById('exam-card').style.display = 'none';
            document.getElementById('setup-card').style.display = 'block';
            document.getElementById('section-select').value = "";
            document.getElementById('student-select').innerHTML = '<option value="">-- اختر الشعبة أولاً --</option>';
        }

        function updateResultsTable() {
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = "";

            if (allResults.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color: #94a3b8;">لا توجد نتائج مسجلة حتى الآن</td></tr>';
                return;
            }

            allResults.forEach(res => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td>${res.name}</td>
                    <td>${res.section}</td>
                    <td><strong>${res.grade} / 10</strong></td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
