<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الامتحان الشفهي الذكية والمطورة</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --success: #059669;
            --danger: #dc2626;
            --bg-main: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .app-container {
            max-width: 850px;
            margin: 20px auto;
            background: var(--card-bg);
            padding: 35px;
            border-radius: 24px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }

        .header-title {
            text-align: center;
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 26px;
            font-weight: 800;
        }

        .rooms-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .room-tile {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            padding: 25px 15px;
            border-radius: 16px;
            text-align: center;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.2);
            transition: all 0.3s ease;
        }

        .room-tile:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 20px -3px rgba(37, 99, 235, 0.3);
        }

        .room-tile h3 { margin: 0; font-size: 18px; font-weight: 700; }

        .setup-panel {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 16px;
        }

        label {
            font-weight: 700;
            color: var(--text-main);
            display: block;
            margin-bottom: 8px;
            font-size: 15px;
        }

        textarea {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: white;
            box-sizing: border-box;
            resize: vertical;
            height: 140px;
        }

        .exam-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef2ff;
            padding: 15px 25px;
            border-radius: 14px;
            margin-bottom: 20px;
            border: 1px solid #c7d2fe;
        }

        .exam-header h4 { margin: 0; color: var(--primary); font-size: 18px; }

        .timer-badge {
            background: var(--danger);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
        }

        .student-display-card {
            background: white;
            border: 2px dashed var(--primary);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            margin-bottom: 15px;
        }

        .student-display-card h3 { margin: 0; font-size: 14px; color: var(--text-muted); }
        .student-display-card h1 { margin: 5px 0 0 0; font-size: 26px; color: var(--primary); font-weight: 800; }

        .question-display-card {
            background: #fffbeb;
            border: 1px solid #fef3c7;
            padding: 20px;
            border-radius: 16px;
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: 700;
            color: #92400e;
            line-height: 1.5;
            text-align: center;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-card {
            background: white;
            border: 2px solid var(--border-color);
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-main);
            text-align: right;
        }

        .option-card:hover {
            border-color: var(--primary);
            background: #f8fafc;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        .btn-primary { background-color: var(--primary); color: white; }
        .btn-primary:hover { background-color: var(--primary-dark); }
        .btn-success { background-color: var(--success); color: white; margin-top: 15px; }
        .btn-secondary { background-color: var(--text-muted); color: white; margin-top: 15px; }

        #alert-notification {
            text-align: center;
            padding: 14px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 16px;
            margin-bottom: 15px;
            display: none;
        }
        .notif-success { background-color: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .notif-danger { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        .grades-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }
        .grades-table th, .grades-table td {
            padding: 12px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }
        .grades-table th { background-color: #f8fafc; color: var(--text-muted); font-weight: 700; }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="app-container">
    <h2 class="header-title">منصة الامتحان الشفهي الذكية 🎓</h2>
    
    <!-- واجهة اختيار الغرف -->
    <div id="rooms-view">
        <p style="text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 16px;">اختر غرفة الشعبة لبدء جلسة الاختبار الشفهي:</p>
        <div class="rooms-container">
            <div class="room-tile" onclick="openRoom('الرابع (أ)')"><h3>غرفة الرابع أ</h3></div>
            <div class="room-tile" onclick="openRoom('الرابع (ب)')"><h3>غرفة الرابع ب</h3></div>
            <div class="room-tile" onclick="openRoom('الخامس (أ)')"><h3>غرفة الخامس أ</h3></div>
            <div class="room-tile" onclick="openRoom('الخامس (ب)')"><h3>غرفة الخامس ب</h3></div>
        </div>
    </div>

    <!-- واجهة إدخال الأسماء -->
    <div id="setup-view" class="setup-panel hidden">
        <h3 id="room-title-setup" style="color: var(--primary); text-align: center; margin-bottom: 20px;"></h3>
        
        <label>📋 الصق أسماء الطلاب هنا (نسخ ولصق دفعة واحدة، كل اسم في سطر):</label>
        <textarea id="students-textarea" placeholder="مثال:&#10;ابراهيم زيد عبد العزيز&#10;ابو عبيدة احمد جبار&#10;احمد إبراهيم مصطفى"></textarea>

        <button class="action-btn btn-primary" style="margin-top: 20px;" onclick="startExamSession()">بدء الجلسة الامتحانية 🚀</button>
        <button class="action-btn btn-secondary" onclick="backToRooms()">العودة لاختيار الغرف 🔙</button>
    </div>

    <!-- واجهة الامتحان الشفهي -->
    <div id="exam-view" class="hidden">
        <div class="exam-header">
            <h4 id="exam-room-title"></h4>
            <div class="timer-badge" id="timer-display">45 ثانية</div>
        </div>

        <div id="alert-notification"></div>

        <div class="student-display-card">
            <h3>الطالب المستهدف حالياً:</h3>
            <h1 id="current-student-name">--</h1>
        </div>

        <div class="question-display-card" id="current-question-text">
            جاري اختيار السؤال...
        </div>

        <div class="options-grid" id="options-grid"></div>

        <button class="action-btn btn-secondary" onclick="skipCurrentStudent()">تخطي هذا الطالب (0/10) ⏭️</button>

        <h3 style="font-size: 15px; color: var(--text-main); margin-top: 25px;">سجل الدرجات النهائي (من 10):</h3>
        <table class="grades-table">
            <thead>
                <tr>
                    <th>اسم الطالب</th>
                    <th>الدرجة من 10</th>
                    <th>الحالة</th>
                </tr>
            </thead>
            <tbody id="grades-table-body"></tbody>
        </table>

        <button class="action-btn btn-success" onclick="exportExcelSheet()">📊 تصدير السجل إلى Excel</button>
        <button class="action-btn btn-secondary" onclick="resetAndReturnRooms()">🔄 إنهاء الجلسة والعودة للغرف</button>
    </div>
</div>

<script>
    let currentRoomName = "";
    let studentsList = [];
    let studentPointer = 0;
    let studentGrades = {}; 
    let examTimer = null;
    let secondsLeft = 45;
    let activeQuestion = null;

    // بنك الأسئلة المنهجية الجاهزة مع الإجابة الصحيحة والخيارات المضللة
    const questionBank = [
        {
            q: "ما المقصود بالصيانة الوقائية للبرمجيات (Software Preventive Maintenance)؟",
            correct: "إجراءات وقائية تعتمد لتجنب حدوث مشكلة محتملة في تطبيق ما أو عدم توافقه مع النظام.",
            options: [
                "إجراءات وقائية تعتمد لتجنب حدوث مشكلة محتملة في تطبيق ما أو عدم توافقه مع النظام.",
                "إجراءات تركز على استبدال القطع التالفة في اللوحة الأم.",
                "حذف نظام التشغيل بالكامل وإعادة تثبيته من جديد.",
                "زيادة سرعة معالج الحاسوب عبر رفع حرارته."
            ]
        },
        {
            q: "ما هي الغاية الأساسية من خدمة تحديث نظام التشغيل Windows بشكل منتظم؟",
            correct: "إضافة خصائص جديدة أو تصحيح عمله بإجراء تحسينات أمنية وعامة.",
            options: [
                "زيادة مساحة القرص الصلب وتوليد مساحة فارغة.",
                "إضافة خصائص جديدة أو تصحيح عمله بإجراء تحسينات أمنية وعامة.",
                "مسح الملفات المؤقتة الخاصة بمتصفح الإنترنت.",
                "إيقاف عمل مروحة المعالج لتبريد النظام."
            ]
        },
        {
            q: "ما هو السبب الرئيسي لنقص المساحة الخزنية بعد ترقية نظام Windows إلى نسخة أحدث؟",
            correct: "احتفاظ النظام الجديد بنسخة احتياطية من ملفات نظام التشغيل القديم.",
            options: [
                "امتلاء صندوق التدوير (Recycle Bin) بالكامل.",
                "تثبيت برامج الألعاب ذات الحجم الكبير جداً.",
                "احتفاظ النظام الجديد بنسخة احتياطية من ملفات نظام التشغيل القديم.",
                "وجود فيروسات خبيثة تحجز مساحة القرص."
            ]
        },
        {
            q: "ما الفرق الأساسي بين ترقية البرمجيات (Upgrade) وتحديثها (Update)؟",
            correct: "الترقية توفر تحسينات جوهرية بإصدار جديد، بينما التحديث يقدم تصحيحات وسد ثغرات وإصلاح أخطاء.",
            options: [
                "الترقية توفر تحسينات جوهرية بإصدار جديد، بينما التحديث يقدم تصحيحات وسد ثغرات وإصلاح أخطاء.",
                "التحديث يكون عبر شراء قرص ليزري جديد فقط.",
                "الترقية تخص أجهزة الهواتف المحمولة والتحديث للحواسيب.",
                "لا يوجد أي فرق بينهما تقنياً."
            ]
        },
        {
            q: "كيف يتم تمييز رقم الترقية ورقم التحديث في إصدارات البرامج مثل (Windows 8.1)؟",
            correct: "الرقم أقصى اليسار (8) يمثل الترقية، والرقم بعد الفاصلة (.1) يمثل التحديث.",
            options: [
                "الرقم أقصى اليسار يمثل سنة الإصدار والرقم الأيمن يمثل السعر.",
                "الرقم أقصى اليسار (8) يمثل الترقية، والرقم بعد الفاصلة (.1) يمثل التحديث.",
                "الأرقام تعبر عن حجم الملف بالميجابايت.",
                "ترتيب الأحرف الهجائية لاسم الشركة المنتجة."
            ]
        },
        {
            q: "ما هي أهمية أداة فحص الأقراص (Check Disk / Scandisk) في نظام التشغيل؟",
            correct: "تشخيص الأخطاء ومحاولة تصحيحها ومعالجة المساحات التالفة على القرص الصلب.",
            options: [
                "تسريع تصفح الإنترنت وحذف الكوكيز.",
                "تشخيص الأخطاء ومحاولة تصحيحها ومعالجة المساحات التالفة على القرص الصلب.",
                "إلغاء تجزئة الملفات وترتيبها بشكل متجاور.",
                "زيادة سرعة دوران القرص الصلب ميكانيكياً."
            ]
        },
        {
            q: "ما هو الغرض والفائدة من برنامج إلغاء تجزئة القرص الصلب (Disk Defragment)؟",
            correct: "إعادة تنظيم مواقع البيانات المخزونة عشوائياً بشكل مساحات متجاورة لتسريع الوصول إليها.",
            options: [
                "حذف ملفات نظام التشغيل القديمة نهائياً.",
                "تغيير خلفية سطح المكتب وزسومات النظام.",
                "إعادة تنظيم مواقع البيانات المخزونة عشوائياً بشكل مساحات متجاورة لتسريع الوصول إليها.",
                "ضغط الملفات الكبيرة لتقليل مساحتها."
            ]
        },
        {
            q: "ما الغاية من تفعيل خاصية (Storage Sense) في نظام التشغيل Windows؟",
            correct: "حذف الملفات المؤقتة تلقائياً لغرض تحسين أداء الحاسوب ومنع بطء تنفيذ المهام.",
            options: [
                "حذف الملفات المؤقتة تلقائياً لغرض تحسين أداء الحاسوب ومنع بطء تنفيذ المهام.",
                "فحص اللوحة الأم من ارتفاع درجات الحرارة.",
                "تحديث برامج الحماية من الفيروسات أسبوعياً.",
                "إغلاق التطبيقات المفتوحة عبر قائمة Task Manager."
            ]
        }
    ];

    function playAudioTone(isSuccess) {
        try {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);

            if (isSuccess) {
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15); 
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                osc.start();
                osc.stop(ctx.currentTime + 0.35);
            } else {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(150, ctx.currentTime);
                osc.frequency.setValueAtTime(100, ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.2, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
                osc.start();
                osc.stop(ctx.currentTime + 0.35);
            }
        } catch(err) { console.log(err); }
    }

    function openRoom(roomTitle) {
        currentRoomName = roomTitle;
        document.getElementById('room-title-setup').innerText = `إدارة غرفة الامتحان: ${roomTitle}`;
        document.getElementById('rooms-view').classList.add('hidden');
        document.getElementById('setup-view').classList.remove('hidden');
    }

    function startExamSession() {
        const manualText = document.getElementById('students-textarea').value.trim();
        if (!manualText) {
            alert("يرجى إدخال أسماء الطلاب في خانة النص (نسخ ولصق) أولاً!");
            return;
        }

        studentsList = manualText.split('\n').map(s => s.trim()).filter(s => s.length > 2);
        studentsList = [...new Set(studentsList)];

        if (studentsList.length === 0) {
            alert("لم يتم العثور على أسماء صالحة. يرجى التأكد من كتابة كل اسم في سطر مستقل.");
            return;
        }

        studentGrades = {};
        studentsList.forEach(s => studentGrades[s] = 0);

        document.getElementById('setup-view').classList.add('hidden');
        document.getElementById('exam-view').classList.remove('hidden');
        document.getElementById('exam-room-title').innerText = `غرفة امتحان: ${currentRoomName} (عدد الطلاب: ${studentsList.length})`;

        studentPointer = 0;
        updateGradesTable();
        loadNextStudentQuestion();
    }

    function runTimer() {
        clearInterval(examTimer);
        secondsLeft = 45;
        document.getElementById('timer-display').innerText = `الوقت المتبقي: ${secondsLeft} ثانية`;
        
        examTimer = setInterval(() => {
            secondsLeft--;
            document.getElementById('timer-display').innerText = `الوقت المتبقي: ${secondsLeft} ثانية`;
            if (secondsLeft <= 0) {
                clearInterval(examTimer);
                playAudioTone(false);
                recordAnswer(false, "انتهى الوقت (خطأ تلقائي)");
            }
        }, 1000);
    }

    function loadNextStudentQuestion() {
        if (studentPointer >= studentsList.length) {
            document.getElementById('current-student-name').innerText = "انتهت قائمة الطلاب بنجاح! 🎓";
            document.getElementById('current-question-text').innerText = "اكتملت الجلسة الامتحانية لجميع طلاب الغرفة.";
            document.getElementById('options-grid').innerHTML = "";
            document.getElementById('alert-notification').style.display = "none";
            clearInterval(examTimer);
            return;
        }

        const student = studentsList[studentPointer];
        
        activeQuestionObj = questionBank[Math.floor(Math.random() * questionBank.length)];

        let shuffledOptions = [...activeQuestionObj.options].sort(() => Math.random() - 0.5);

        document.getElementById('current-student-name').innerText = student;
        document.getElementById('current-question-text').innerText = activeQuestionObj.q;
        document.getElementById('alert-notification').style.display = "none";

        const grid = document.getElementById('options-grid');
        grid.innerHTML = "";

        shuffledOptions.forEach((opt, idx) => {
            const btn = document.createElement('div');
            btn.className = 'option-card';
            btn.innerHTML = `<strong>${['أ', 'ب', 'ج', 'د'][idx]})</strong> ${opt}`;
            btn.onclick = () => {
                const isCorrect = (opt === activeQuestionObj.correct);
                recordAnswer(isCorrect, opt);
            };
            grid.appendChild(btn);
        });

        runTimer();
    }

    function skipCurrentStudent() {
        clearInterval(examTimer);
        recordAnswer(false, "تم تخطي السؤال");
    }

    function recordAnswer(isSuccess, chosenOptionText) {
        clearInterval(examTimer);
        if (studentPointer >= studentsList.length) return;

        const student = studentsList[studentPointer];
        const banner = document.getElementById('alert-notification');

        playAudioTone(isSuccess);

        if (isSuccess) {
            studentGrades[student] = 10;
            banner.className = "notif-success";
            banner.innerHTML = `✔️ إجابة صحيحة! حصل الطالب على (10/10).`;
        } else {
            studentGrades[student] = 0;
            banner.className = "notif-danger";
            banner.innerHTML = `❌ إجابة خاطئة!<br><b>الإجابة الصحيحة هي:</b> ${activeQuestionObj.correct}`;
        }
        banner.style.display = "block";

        updateGradesTable();

        studentPointer++;
        setTimeout(() => {
            loadNextStudentQuestion();
        }, 3200);
    }

    function updateGradesTable() {
        const tbody = document.getElementById('grades-table-body');
        tbody.innerHTML = "";
        studentsList.forEach((stu, idx) => {
            let grade = studentGrades[stu] !== undefined ? studentGrades[stu] : "-";
            let status = grade === 10 ? "✔️ ممتاز (10)" : (grade === 0 && idx < studentPointer ? "❌ غير موفق (0)" : "⏳ بانتظار الدور");
            const row = document.createElement('tr');
            row.innerHTML = `<td><b>${stu}</b></td><td><b>${grade} / 10</b></td><td>${status}</td>`;
            tbody.appendChild(row);
        });
    }

    function exportExcelSheet() {
        const tableHTML = document.querySelector('.grades-table').outerHTML;
        const blob = new Blob(['\ufeff' + tableHTML], { type: 'application/vnd.ms-excel;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `سجل_درجات_${currentRoomName}_امتحان_شفهي.xls`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function backToRooms() {
        clearInterval(examTimer);
        document.getElementById('setup-view').classList.add('hidden');
        document.getElementById('rooms-view').classList.remove('hidden');
        document.getElementById('students-textarea').value = "";
    }

    function resetAndReturnRooms() {
        backToRooms();
        document.getElementById('grades-table-body').innerHTML = "";
        document.getElementById('alert-notification').style.display = "none";
    }
</script>

</body>
</html>
