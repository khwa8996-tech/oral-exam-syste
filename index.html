<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة غرف الامتحان الشفهي الذكية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 750px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 25px;
        }
        .rooms-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }
        .room-card {
            background: linear-gradient(135deg, #1a73e8, #4285f4);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(26,115,232,0.3);
            transition: 0.2s;
        }
        .room-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(26,115,232,0.4);
        }
        .section-box {
            background: #e8f0fe;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        textarea, button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ccc;
            margin-top: 10px;
            box-sizing: border-box;
        }
        textarea {
            resize: vertical;
            height: 120px;
        }
        .student-box {
            background: #f8f9fa;
            border: 2px dashed #1a73e8;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #174ea6;
        }
        .question-box {
            background: #fff8e1;
            border: 1px solid #ffe0b2;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: bold;
            color: #e65100;
        }
        .timer {
            text-align: center;
            font-size: 18px;
            color: #d93025;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }
        .btn-correct { background-color: #34a853; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-wrong { background-color: #ea4335; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-start { background-color: #1a73e8; color: white; border: none; cursor: pointer; font-weight: bold; }
        .btn-back { background-color: #6c757d; color: white; border: none; cursor: pointer; font-weight: bold; margin-top: 15px; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
        th { background-color: #f8f9fa; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>منصة غرف الامتحان الشفهي الذكية</h2>
    
    <!-- واجهة اختيار غرف الشعب -->
    <div id="rooms-section">
        <h3 style="text-align: center; color: #555; margin-bottom: 20px;">اختر غرفة الشعبة لبيان الطلاب وبدء الامتحان:</h3>
        <div class="rooms-grid">
            <div class="room-card" onclick="openRoom('4A', 'الرابع (أ)')">غرفة الرابع أ 🏫</div>
            <div class="room-card" onclick="openRoom('4B', 'الرابع (ب)')">غرفة الرابع ب 🏫</div>
            <div class="room-card" onclick="openRoom('5A', 'الخامس (أ)')">غرفة الخامس أ 🏫</div>
            <div class="room-card" onclick="openRoom('5B', 'الخامس (ب)')">غرفة الخامس ب 🏫</div>
        </div>
    </div>

    <!-- واجهة إدخال الأسئلة للشعبة المختارة -->
    <div class="section-box hidden" id="setup-section">
        <h3 id="room-title-setup" style="color: #1a73e8; text-align: center;"></h3>
        <p style="text-align: center; color: #666;">قم بلصق محتوى المحاضرة أو أسئلة الامتحان أدناه:</p>
        <textarea id="lecture-input" placeholder="اكتب أو الصق الأسئلة هنا، كل سؤال في سطر:
س: ما هو نظام التشغيل؟
س: ما وظيفة لوحة المفاتيح؟"></textarea>
        <button class="btn-start" onclick="startExam()">دخول الغرفة وبدء الامتحان 🚀</button>
        <button class="btn-back" onclick="backToRooms()">العودة لاختيار الغرف 🔙</button>
    </div>

    <!-- واجهة الامتحان الفعلية داخل الغرفة -->
    <div id="exam-section" class="hidden">
        <div id="room-title-exam" style="text-align: center; font-weight: bold; color: #1a73e8; font-size: 20px; margin-bottom: 10px;"></div>
        
        <div class="student-box" id="current-student">الطالب: --</div>
        <div class="question-box" id="current-question">السؤال: --</div>
        <div class="timer" id="timer-display">الوقت المتبقي: 45 ثانية</div>

        <!-- أزرار التقييم (صح / خطأ) -->
        <div class="action-buttons">
            <button class="action-btn btn-correct" style="padding: 15px; border-radius: 8px; flex:1;" onclick="evaluateAnswer('✔️ صح (+3)')">✔️ صح (+3)</button>
            <button class="action-btn btn-wrong" style="padding: 15px; border-radius: 8px; flex:1;" onclick="evaluateAnswer('❌ خطأ (0)')">❌ خطأ (0)</button>
        </div>

        <button class="btn-start" style="margin-bottom: 15px;" onclick="nextStep()">السؤال أو الطالب التالي 🔄</button>

        <h3>سجل درجات الغرفة:</h3>
        <table>
            <thead>
                <tr>
                    <th>اسم الطالب</th>
                    <th>التقييم المسجل</th>
                </tr>
            </thead>
            <tbody id="results-table-body"></tbody>
        </table>

        <!-- زر التصفير والعودة للغرف -->
        <button class="btn-back" onclick="resetAndBackToRooms()">🔄 تصفير النتائج والعودة للغرف</button>
    </div>
</div>

<script>
    // قاعدة بيانات أسماء الطلاب لكل غرفة شعبة (يمكنك تعديلها في أي وقت)
    const schoolData = {
        "4A": ["أحمد محمد علي", "حسين علي حسن", "كرار حيدر كاظم", "مصطفى قاسم محمد"],
        "4B": ["سارة أحمد جاسم", "فاطمة كريم عبد الله", "زهراء علي حسين", "مريم حسن عبد"],
        "5A": ["محمد باقر علي", "زينب مصطفى جواد", "علي رضا مهدي", "رقية حيمد كاظم"],
        "5B": ["يوسف إبراهيم خليل", "بنين أحمد عبد الرضا", "حسن مجيد حميد", "درغام فلاح حسن"]
    };

    let selectedClassKey = "";
    let selectedClassName = "";
    let currentStudentsList = [];
    let questionsList = [];
    let studentIndex = -1;
    let questionIndex = 0;
    let timer;
    let timeLeft = 45;

    function openRoom(classKey, className) {
        selectedClassKey = classKey;
        selectedClassName = className;
        
        document.getElementById("room-title-setup").innerText = `إعداد أسئلة امتحان: ${className}`;
        document.getElementById("rooms-section").classList.add("hidden");
        document.getElementById("setup-section").classList.remove("hidden");
    }

    function startExam() {
        const lectureText = document.getElementById("lecture-input").value.trim();
        if(!lectureText) {
            alert("يرجى إدخال محتوى المحاضرة أو الأسئلة أولاً!");
            return;
        }

        currentStudentsList = schoolData[selectedClassKey];
        questionsList = lectureText.split('\n').filter(line => line.trim().length > 0);

        document.getElementById("room-title-exam").innerText = `غرفة امتحان: ${selectedClassName}`;
        document.getElementById("setup-section").classList.add("hidden");
        document.getElementById("exam-section").classList.remove("hidden");

        studentIndex = -1;
        questionIndex = 0;
        document.getElementById("results-table-body").innerHTML = "";
        nextStep();
    }

    function startTimer() {
        clearInterval(timer);
        timeLeft = 45;
        document.getElementById("timer-display").innerText = `الوقت المتبقي: ${timeLeft} ثانية`;
        
        timer = setInterval(() => {
            timeLeft--;
            document.getElementById("timer-display").innerText = `الوقت المتبقي: ${timeLeft} ثانية`;
            if (timeLeft <= 0) {
                clearInterval(timer);
                document.getElementById("timer-display").innerText = "انتهى الوقت المخصص للإجابة!";
            }
        }, 1000);
    }

    function nextStep() {
        studentIndex++;
        if (studentIndex >= currentStudentsList.length) {
            document.getElementById("current-student").innerText = "انتهت قائمة طلاب هذه الغرفة! 🎓";
            document.getElementById("current-question").innerText = "انتهت الأسئلة.";
            clearInterval(timer);
            return;
        }

        const currentStudent = currentStudentsList[studentIndex];
        const currentQ = questionsList[questionIndex % questionsList.length];
        questionIndex++;

        document.getElementById("current-student").innerText = `الطالب: ${currentStudent}`;
        document.getElementById("current-question").innerText = `السؤال: ${currentQ}`;
        startTimer();
    }

    function evaluateAnswer(statusText) {
        if (studentIndex < 0 || studentIndex >= currentStudentsList.length) {
            alert("الرجاء بدء الامتحان أولاً!");
            return;
        }

        const studentName = currentStudentsList[studentIndex];
        const tableBody = document.getElementById("results-table-body");
        const newRow = document.createElement("tr");
        newRow.innerHTML = `<td>${studentName}</td><td>${statusText}</td>`;
        tableBody.appendChild(newRow);

        nextStep();
    }

    function backToRooms() {
        clearInterval(timer);
        document.getElementById("setup-section").classList.add("hidden");
        document.getElementById("rooms-section").classList.remove("hidden");
        document.getElementById("lecture-input").value = "";
    }

    function resetAndBackToRooms() {
        clearInterval(timer);
        document.getElementById("exam-section").classList.add("hidden");
        document.getElementById("rooms-section").classList.remove("hidden");
        document.getElementById("lecture-input").value = "";
        document.getElementById("results-table-body").innerHTML = "";
    }
</script>

</body>
</html>
