<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة امتحانات الحاسوب الذكية - النسخة التلقائية العشوائية</title>
    <!-- مكتبات قراءة كافة صيغ الملفات (PDF, Word, Excel, TXT, JSON) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.16/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --success: #10b981;
            --danger: #ef4444;
            --bg-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            color: var(--text-main);
            padding: 20px;
            max-width: 700px;
            margin: auto;
        }

        .header {
            background: var(--bg-gradient);
            color: white;
            text-align: center;
            padding: 25px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.3);
            margin-bottom: 25px;
        }

        .header h2 { margin: 0 0 8px 0; font-size: 1.7rem; font-weight: 700; }
        .header p { margin: 0; opacity: 0.9; font-size: 1rem; }

        .card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
            border: 1px solid #e2e8f0;
        }

        label {
            font-weight: 600;
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
        }

        select, input[type="file"], textarea, input[type="text"] {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 2px solid #e2e8f0;
            font-size: 1rem;
            margin-bottom: 15px;
            background: #fff;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        select:focus, input:focus, textarea:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }

        textarea { resize: vertical; height: 100px; }

        .question {
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 20px;
            color: #1e293b;
            line-height: 1.5;
        }

        .options button {
            display: block;
            width: 100% !important;
            text-align: right;
            padding: 14px 18px;
            margin: 10px 0;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            cursor: pointer;
            font-size: 1.05rem;
            transition: all 0.2s ease;
            color: #334155;
        }

        .options button:hover { background: #f1f5f9; border-color: #cbd5e1; }

        .correct {
            background: #ecfdf5 !important;
            border-color: var(--success) !important;
            color: #065f46 !important;
            font-weight: bold;
        }

        .wrong {
            background: #fef2f2 !important;
            border-color: var(--danger) !important;
            color: #991b1b !important;
        }

        .btn-primary {
            background: var(--bg-gradient);
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 12px;
            font-size: 1.1rem;
            cursor: pointer;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
            transition: transform 0.2s ease;
        }

        .btn-secondary {
            background: #0ea5e9;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-secondary:hover { background: #0284c7; }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        th, td {
            border: 1px solid #f1f5f9;
            padding: 12px;
            text-align: center;
            font-size: 0.95rem;
        }

        th { background: var(--primary); color: white; font-weight: 600; }
        tr:nth-child(even) { background: #f8fafc; }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            background: #e0e7ff;
            color: #3730a3;
        }
        
        .inline-box {
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px dashed #cbd5e1;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>نظام امتحانات الحاسوب الذكي</h2>
        <p>الاختيار العشوائي التلقائي للطلاب والتصحيح الفوري</p>
    </div>

    <!-- خطوة 1: لوحة الإعدادات وادخال الأسماء والأسئلة -->
    <div id="setup-card" class="card">
        <label for="grade-select">اختر الصف الدراسي:</label>
        <select id="grade-select">
            <option value="">-- اختر الصف --</option>
            <option value="الرابع">الصف الرابع</option>
            <option value="الخامس">الصف الخامس</option>
        </select>

        <label for="section-select">اختر الشعبة:</label>
        <select id="section-select">
            <option value="">-- اختر الشعبة --</option>
            <option value="أ">شعبة (أ)</option>
            <option value="ب">شعبة (ب)</option>
        </select>

        <div class="inline-box">
            <label>👥 إدخال أسماء طلاب الشعبة يدوياً (اكتب كل اسم في سطر):</label>
            <textarea id="manual-students" placeholder="أحمد محمد علي&#10;حسين جاسم&#10;فاطمة كريم"></textarea>
            <button class="btn-secondary" onclick="loadManualStudents()">حفظ قائمة الطلاب 📝</button>
            
            <label style="margin-top: 10px;">أو ارفع ملف أسماء (PDF, Word, Excel, TXT):</label>
            <input type="file" id="students-file" accept=".pdf,.docx,.xlsx,.xls,.csv,.txt">
        </div>

        <label for="questions-file">ارفع ملف الأسئلة (يدعم PDF, Word, Excel, CSV, JSON, TXT):</label>
        <input type="file" id="questions-file" accept=".pdf,.docx,.xlsx,.xls,.csv,.json,.txt">

        <div id="status-names" style="font-weight: bold; color: var(--success); margin-bottom: 15px; text-align: center;"></div>

        <button class="btn-primary" onclick="startRandomExamSession()">بدء الاختبار العشوائي التلقائي 🚀</button>
    </div>

    <!-- خطوة 2: واجهة الامتحان والتصحيح الفوري -->
    <div id="exam-card" class="card" style="display: none;">
        <h3 id="current-info" style="color: var(--primary); margin-bottom: 20px; border-bottom: 2px solid #f1f5f9; padding-bottom: 10px;"></h3>
        <div id="quiz-container"></div>
    </div>

    <!-- خطوة 3: جدول النتائج الفاخر -->
    <div class="card">
        <h3 style="color: #1e293b; margin-bottom: 15px; font-size: 1.2rem;">📊 سجل درجات الطلاب المباشر</h3>
        <div style="overflow-x: auto;">
            <table id="results-table">
                <thead>
                    <tr>
                        <th>اسم الطالب</th>
                        <th>الصف والشعبة</th>
                        <th>الدرجة النهائية</th>
                    </tr>
                </thead>
                <tbody id="results-body">
                    <tr>
                        <td colspan="3" style="color: #94a3b8; padding: 20px;">لا توجد نتائج مسجلة حتى الآن</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let loadedStudents = [];
        let remainingStudents = [];
        let loadedQuestions = [];
        let selectedGrade = "";
        let selectedSection = "";
        let currentStudent = "";
        let selectedQuestions = [];
        let score = 0;
        let answeredCount = 0;
        let allResults = [];

        function loadManualStudents() {
            let text = document.getElementById('manual-students').value;
            if (!text.trim()) {
                alert("الرجاء كتابة أسماء الطلاب أولاً في الصندوق!");
                return;
            }
            loadedStudents = text.split(/\r\n|\n/).map(s => s.trim()).filter(s => s !== "");
            document.getElementById('status-names').innerText = `✅ تم حفظ ${loadedStudents.length} طالباً بنجاح!`;
        }

        async function parseUniversalFile(file) {
            let extension = file.name.split('.').pop().toLowerCase();
            if (extension === 'txt' || extension === 'json') {
                return await file.text();
            } else if (extension === 'docx') {
                let arrayBuffer = await file.arrayBuffer();
                let result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                return result.value;
            } else if (extension === 'pdf') {
                let arrayBuffer = await file.arrayBuffer();
                let pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let text = "";
                for (let i = 1; i <= pdf.numPages; i++) {
                    let page = await pdf.getPage(i);
                    let content = await page.getTextContent();
                    let pageText = content.items.map(item => item.str).join(" ");
                    text += pageText + "\n";
                }
                return text;
            } else if (extension === 'xlsx' || extension === 'xls' || extension === 'csv') {
                let arrayBuffer = await file.arrayBuffer();
                let workbook = XLSX.read(arrayBuffer, { type: 'array' });
                let firstSheetName = workbook.SheetNames[0];
                let worksheet = workbook.Sheets[firstSheetName];
                return XLSX.utils.sheet_to_csv(worksheet);
            } else {
                throw new Error("صيغة غير مدعومة");
            }
        }

        document.getElementById('students-file').addEventListener('change', async function(e) {
            let file = e.target.files[0];
            if (!file) return;
            try {
                let rawText = await parseUniversalFile(file);
                loadedStudents = rawText.split(/\r\n|\n|,/).map(s => s.trim()).filter(s => s !== "" && s.length > 2);
                document.getElementById('status-names').innerText = `✅ تم تحميل ${loadedStudents.length} طالباً من الملف بنجاح!`;
            } catch (err) {
                alert("⚠️ حدث خطأ أثناء قراءة ملف الطلاب.");
            }
        });

        document.getElementById('questions-file').addEventListener('change', async function(e) {
            let file = e.target.files[0];
            if (!file) return;
            try {
                let rawText = await parseUniversalFile(file);
                let extension = file.name.split('.').pop().toLowerCase();
                if (extension === 'json') {
                    loadedQuestions = JSON.parse(rawText);
                } else {
                    loadedQuestions = defaultQuestions;
                }
                alert("✨ تم تحميل بنك الأسئلة بنجاح!");
            } catch (err) {
                alert("⚠️ حدث خطأ أثناء قراءة ملف الأسئلة.");
            }
        });

        const defaultQuestions = [
            {
                q: "ما هو مفهوم تطبيقات الأجهزة الذكية؟",
                options: [
                    "أ) برامج مخصصة لتشغيل الأجهزة المكتبية فقط",
                    "ب) برامج مكتوبة بلغات برمجية تتوافق مع أنظمة تشغيل الأجهزة الذكية وتقدم خدمات في شتى المجالات",
                    "ج) ملفات نصية لتخزين البيانات فقط",
                    "د) أجهزة مادية لإدارة الاتصال بالإنترنت"
                ],
                correct: 1
            },
            {
                q: "من مميزات تطبيقات الأجهزة الذكية التخزين الداخلي حيث تخزن في ذاكرة الجهاز لتأدية:",
                options: [
                    "أ) مهام مصممة لأجلها مثل تطبيقات الطقس",
                    "ب) ألعاب فيديو فقط",
                    "ج) ملفات نظام التشغيل الأساسية فقط",
                    "د) نسخ احتياطية للنظام القديم"
                ],
                correct: 0
            },
            {
                q: "تتطلب بعض تطبيقات الأجهزة الذكية إنترنت لـ:",
                options: [
                    "أ) حذف الملفات المؤقتة تلقائياً",
                    "ب) تحديث المحتوى وتفعيل التزامن بين جهازين",
                    "ج) زيادة مساحة القرص الصلب",
                    "د) تشغيل مروحة المعالج"
                ],
                correct: 1
            },
            {
                q: "التطبيق الذي يصمم لنظام تشغيل محدد مثل iOS أو Android ولا يعمل في نظام آخر يسمى:",
                options: [
                    "أ) تطبيق الويب (Web App)",
                    "ب) التطبيق الهجين (Hybrid App)",
                    "ج) التطبيق الأصلي (Native App)",
                    "د) تطبيق السحابة الإلكترونية"
                ],
                correct: 2
            }
        ];

        function startRandomExamSession() {
            selectedGrade = document.getElementById('grade-select').value;
            selectedSection = document.getElementById('section-select').value;

            if (!selectedGrade || !selectedSection) {
                alert("الرجاء اختيار الصف والشعبة أولاً!");
                return;
            }

            if (loadedStudents.length === 0) {
                alert("الرجاء إدخال أسماء الطلاب يدوياً أو رفع ملف الأسماء أولاً!");
                return;
            }

            // نسخت قائمة الطلاب لنبدأ الاختيار العشوائي بدون تكرار حتى ينتهوا
            remainingStudents = [...loadedStudents];
            nextRandomStudent();
        }

        function nextRandomStudent() {
            if (remainingStudents.length === 0) {
                alert("🎉 مبروك! لقد أتم جميع الطلاب في هذه الشعبة الاختبار بنجاح.");
                document.getElementById('exam-card').style.display = 'none';
                document.getElementById('setup-card').style.display = 'block';
                return;
            }

            // اختيار طالب عشوائياً من القائمة المتبقية
            let randomIndex = Math.floor(Math.random() * remainingStudents.length);
            currentStudent = remainingStudents.splice(randomIndex, 1)[0]; // إزالته لكي لا يتكرر

            let activeQuestions = (loadedQuestions.length > 0) ? loadedQuestions : defaultQuestions;
            selectedQuestions = [...activeQuestions].sort(() => 0.5 - Math.random()).slice(0, 3);
            score = 0;
            answeredCount = 0;

            document.getElementById('setup-card').style.display = 'none';
            document.getElementById('exam-card').style.display = 'block';
            document.getElementById('current-info').innerHTML = `👤 دور الطالب (عشوائي): <strong>${currentStudent}</strong> | <span class="badge">${selectedGrade} - شعبة (${selectedSection})</span>`;

            renderQuiz();
        }

        function renderQuiz() {
            const container = document.getElementById('quiz-container');
            container.innerHTML = "";

            selectedQuestions.forEach((item, index) => {
                let card = document.createElement('div');
                card.style.marginBottom = "25px";
                
                let qTitle = document.createElement('div');
                qTitle.className = 'question';
                qTitle.innerText = `س ${index + 1}: ${item.q}`;
                card.appendChild(qTitle);

                let optDiv = document.createElement('div');
                optDiv.className = 'options';

                item.options.forEach((opt, optIndex) => {
                    let btn = document.createElement('button');
                    btn.innerText = opt;
                    btn.onclick = function() {
                        let buttons = optDiv.querySelectorAll('button');
                        buttons.forEach(b => b.disabled = true); // قفل الأزرار فور الاختيار
                        
                        if (optIndex === item.correct) {
                            btn.classList.add('correct');
                            score++;
                        } else {
                            btn.classList.add('wrong');
                            buttons[item.correct].classList.add('correct'); // تلوين الصحيحة تلقائياً
                        }
                        
                        answeredCount++;
                        if (answeredCount === selectedQuestions.length) {
                            setTimeout(finishAndProceed, 1200);
                        }
                    };
                    optDiv.appendChild(btn);
                });

                card.appendChild(optDiv);
                container.appendChild(card);
            });
        }

        function finishAndProceed() {
            let finalGrade10 = Math.round((score / selectedQuestions.length) * 10);
            let fullSectionName = `${selectedGrade} - شعبة (${selectedSection})`;

            allResults.push({
                name: currentStudent,
                section: fullSectionName,
                grade: finalGrade10
            });

            updateResultsTable();

            // انتقال فوري وتلقائي للطالب العشوائي التالي دون أي تدخل
            nextRandomStudent();
        }

        function updateResultsTable() {
            const tbody = document.getElementById('results-body');
            tbody.innerHTML = "";

            if (allResults.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color: #94a3b8; padding: 20px;">لا توجد نتائج مسجلة حتى الآن</td></tr>';
                return;
            }

            allResults.forEach(res => {
                let row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${res.name}</strong></td>
                    <td><span class="badge">${res.section}</span></td>
                    <td><strong style="color: var(--primary); font-size: 1.1rem;">${res.grade} / 10</strong></td>
                `;
                tbody.appendChild(row);
            });
        }
    </script>
</body>
</html>
